<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YepTennis — Scores, Calendar & BBC News</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎾 YepTennis & 📰 BBC News Hub</h1>
    <p id="refresh-status">Auto-refreshes 6x daily (Every 4 hours)</p>
  </header>

  <main class="container">
    <section class="card">
      <h2>📅 Upcoming Tournament Calendar</h2>
      <div id="calendar-container">Loading schedule...</div>
    </section>

    <section class="card">
      <h2>🏆 Scores & Results (Last 4 Days)</h2>
      <div id="results-container">Loading scores...</div>
    </section>

    <section class="card full-width">
      <h2>🌐 BBC News — Latest Headlines</h2>
      <div id="news-container" class="news-grid">Loading headlines...</div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
